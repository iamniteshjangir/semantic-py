site_name: PySemantic
site_url: https://pysemantic.com
site_description: A lightweight, graph-based Semantic Layer for Python and SQL.
site_author: Nitesh Jangir

repo_url: https://github.com/iamniteshjangir/semantic-py/
repo_name: iamniteshjangir/semantic-py

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/cube-outline
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/iamniteshjangir/semantic-py/
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/nitesh-jangir/
      name: LinkedIn
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pysemantic-layer/
      name: PyPI

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - CLI & Studio: cli-studio.md
  - Multi-Fact Queries: multi-fact-queries.md

copyright: Copyright &copy; 2026 Nitesh Jangir
